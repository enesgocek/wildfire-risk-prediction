[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wildfire-risk-prediction"
version = "0.1.0"
description = "Antalya, Mugla, Izmir ve Mersin icin 24 saatlik yangin riski arastirma projesi"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlflow>=3.7,<4",
  "earthengine-api>=1,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "geopandas>=1,<2",
  "shapely>=2,<3",
  "matplotlib>=3.10,<4",
  "rasterio>=1.4,<2",
  "numpy>=2,<3",
  "pyproj>=3.7,<4",
  "exactextract>=0.3,<1",
  "pandas>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "uv==0.12.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_risk_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "outputs/cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "outputs/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
